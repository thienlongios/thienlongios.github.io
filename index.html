    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }
        .font-serif { font-family: 'Playfair Display', serif; }

        /* ============================================
           GLASS CARD
           ============================================ */
        .glass-card-main {
            background: rgba(10, 10, 10, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* ============================================
           3D CONTENT LAYERS
           ============================================ */
        .layer-1 { transform: translateZ(40px); }
        .layer-2 { transform: translateZ(70px); filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6)); }
        .layer-3 { transform: translateZ(100px); filter: drop-shadow(0 12px 15px rgba(0,0,0,0.8)); }

        /* ============================================
           ANIMATED GRADIENT BORDER (Holographic)
           ============================================ */
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes rotateBorder {
            to { --border-angle: 360deg; }
        }
        .holo-border {
            position: relative;
        }
        .holo-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 2.1rem;
            padding: 2px;
            background: conic-gradient(
                from var(--border-angle),
                #ff6ec7 0%,
                #7b68ee 15%,
                #00d4ff 30%,
                #39ff14 45%,
                #ffd700 60%,
                #ff6ec7 75%,
                #7b68ee 90%,
                #ff6ec7 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateBorder 4s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.85;
            filter: blur(0.5px);
        }
        /* Outer glow that follows the gradient */
        .holo-border::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 2.3rem;
            background: conic-gradient(
                from var(--border-angle),
                rgba(255,110,199,0.15) 0%,
                rgba(123,104,238,0.15) 25%,
                rgba(0,212,255,0.15) 50%,
                rgba(57,255,20,0.1) 75%,
                rgba(255,110,199,0.15) 100%
            );
            animation: rotateBorder 4s linear infinite;
            filter: blur(12px);
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================
           AVATAR SPINNING GRADIENT RING
           ============================================ */
        @keyframes ringRotate {
            to { transform: rotate(360deg); }
        }
        .avatar-ring-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(
                from 0deg,
                #ff6ec7,
                #7b68ee,
                #00d4ff,
                #39ff14,
                #ffd700,
                #ff6ec7
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: ringRotate 3s linear infinite;
            z-index: 5;
        }
        .avatar-ring-glow {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255,110,199,0.2),
                rgba(123,104,238,0.2),
                rgba(0,212,255,0.2),
                rgba(57,255,20,0.15),
                rgba(255,110,199,0.2)
            );
            animation: ringRotate 3s linear infinite;
            filter: blur(10px);
            z-index: 4;
            pointer-events: none;
        }

        /* ============================================
           FOUR-POINT STAR FALL (around avatar)
           ============================================ */
        @keyframes starFall {
            0%   { transform: translateY(-15px) rotate(0deg) scale(0); opacity: 0; }
            20%  { opacity: 1; transform: translateY(10px) rotate(45deg) scale(1.2); }
            70%  { opacity: 1; transform: translateY(50px) rotate(90deg) scale(1); }
            100% { transform: translateY(90px) rotate(180deg) scale(0); opacity: 0; }
        }
        .four-point-star {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
            animation: starFall 2s linear forwards;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
            z-index: 30;
        }

        /* ============================================
           TYPING CURSOR
           ============================================ */
        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #0ea5e9;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ============================================
           STAGGER REVEAL for social buttons
           ============================================ */
        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.95);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        .social-btn {
            opacity: 0;
            animation: revealUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .social-btn:nth-child(1) { animation-delay: 0.8s; }
        .social-btn:nth-child(2) { animation-delay: 1.0s; }
        .social-btn:nth-child(3) { animation-delay: 1.2s; }
        .social-btn:nth-child(4) { animation-delay: 1.4s; }

        /* Hover glow per-brand */
        .social-btn.facebook:hover { background: rgba(24, 119, 242, 0.2); border-color: rgba(24, 119, 242, 0.8); box-shadow: 0 0 25px rgba(24, 119, 242, 0.5), 0 0 60px rgba(24, 119, 242, 0.15); transform: translateY(-3px) scale(1.02); }
        .social-btn.zalo:hover     { background: rgba(0, 104, 255, 0.2); border-color: rgba(0, 104, 255, 0.8); box-shadow: 0 0 25px rgba(0, 104, 255, 0.5), 0 0 60px rgba(0, 104, 255, 0.15); transform: translateY(-3px) scale(1.02); }
        .social-btn.telegram:hover { background: rgba(14, 165, 233, 0.2); border-color: rgba(14, 165, 233, 0.8); box-shadow: 0 0 25px rgba(14, 165, 233, 0.5), 0 0 60px rgba(14, 165, 233, 0.15); transform: translateY(-3px) scale(1.02); }
        .social-btn.tiktok:hover   { background: rgba(236, 72, 153, 0.2); border-color: rgba(236, 72, 153, 0.8); box-shadow: 0 0 25px rgba(236, 72, 153, 0.5), 0 0 60px rgba(236, 72, 153, 0.15); transform: translateY(-3px) scale(1.02); }
        .social-btn:active { transform: translateY(0) scale(0.98) !important; }

        /* ============================================
           CARD ENTRANCE
           ============================================ */
        @keyframes cardEntrance {
            0%   { opacity: 0; transform: translateY(40px) scale(0.92); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .card-entrance {
            animation: cardEntrance 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ============================================
           BADGE ENTRANCE
           ============================================ */
        @keyframes badgePop {
            0%   { opacity: 0; transform: scale(0.5); }
            60%  { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .badge-anim {
            opacity: 0;
            animation: badgePop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .badge-anim:nth-child(1) { animation-delay: 0.5s; }
        .badge-anim:nth-child(2) { animation-delay: 0.65s; }
        .badge-anim:nth-child(3) { animation-delay: 0.8s; }

        /* ============================================
           STATUS PULSE
           ============================================ */
        @keyframes statusGlow {
            0%, 100% { box-shadow: 0 0 4px rgba(52, 211, 153, 0.4); }
            50%      { box-shadow: 0 0 12px rgba(52, 211, 153, 0.8); }
        }
        .status-badge {
            animation: statusGlow 2s ease-in-out infinite;
        }

        /* ============================================
           VISITOR COUNTER ANIMATION
           ============================================ */
        @keyframes countUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .count-reveal {
            animation: countUp 0.5s ease-out forwards;
            animation-delay: 1.8s;
            opacity: 0;
        }

        /* ============================================
           ACCESSIBILITY
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

    <script>
    (function() {
        'use strict';

        // ==========================================
        // AVATAR STAR PARTICLES (Fixed memory leak)
        // ==========================================
        let starIntervalId = null;

        function initAvatarStars() {
            const container = document.getElementById('avatar-stars-container');
            if (!container) return;

            // Clear any previous interval
            if (starIntervalId) clearInterval(starIntervalId);

            starIntervalId = setInterval(() => {
                // Pause when tab is hidden
                if (document.hidden) return;

                // Limit max concurrent stars to prevent DOM bloat
                if (container.children.length >= 8) return;

                const star = document.createElement('div');
                star.classList.add('four-point-star');
                star.style.left = (Math.random() * 100) + '%';
                star.style.top = '-15px';
                const scale = Math.random() * 0.5 + 0.8;
                star.style.transform = 'scale(' + scale + ')';
                container.appendChild(star);

                // Self-cleanup after animation ends
                star.addEventListener('animationend', () => star.remove(), { once: true });
            }, 350);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (starIntervalId) clearInterval(starIntervalId);
        });

        // ==========================================
        // 3D TILT INITIALIZATION
        // ==========================================
        let tiltInstance = null;

        function initTilt() {
            const el = document.getElementById('tilt-box');
            if (!el || typeof VanillaTilt === 'undefined') return;
            if (tiltInstance) tiltInstance.destroy();

            VanillaTilt.init(el, {
                max: 22,
                speed: 400,
                glare: true,
                'max-glare': 0.12,
                scale: 1.05,
                gyroscope: true
            });
            tiltInstance = el.vanillaTilt;
        }

        // Gyroscope permission for iOS 13+
        window.requestGyroPermission = function() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(function(response) {
                    if (response === 'granted') {
                        document.getElementById('gyro-banner').style.display = 'none';
                        initTilt();
                    }
                }).catch(console.error);
            } else {
                document.getElementById('gyro-banner').style.display = 'none';
            }
        };

        // Attach click handler
        var gyroBtn = document.getElementById('gyro-permission-btn');
        if (gyroBtn) gyroBtn.addEventListener('click', window.requestGyroPermission);

        // ==========================================
        // TYPING EFFECT (with loop)
        // ==========================================
        const TYPING_TEXT = 'ĐẸP TRAI VÀ ĐẲNG CẤP';
        const TYPING_SPEED = 120;
        const PAUSE_BEFORE_DELETE = 2500;
        const DELETE_SPEED = 60;
        const PAUSE_BEFORE_RETYPE = 800;

        function initTyping() {
            const el = document.getElementById('typing-text');
            if (!el) return;

            let charIndex = 0;
            let isDeleting = false;

            function tick() {
                if (document.hidden) {
                    setTimeout(tick, 200);
                    return;
                }

                if (!isDeleting) {
                    // Typing forward
                    el.textContent = TYPING_TEXT.substring(0, charIndex + 1);
                    charIndex++;
                    if (charIndex >= TYPING_TEXT.length) {
                        isDeleting = true;
                        setTimeout(tick, PAUSE_BEFORE_DELETE);
                        return;
                    }
                    setTimeout(tick, TYPING_SPEED);
                } else {
                    // Deleting
                    el.textContent = TYPING_TEXT.substring(0, charIndex - 1);
                    charIndex--;
                    if (charIndex <= 0) {
                        isDeleting = false;
                        setTimeout(tick, PAUSE_BEFORE_RETYPE);
                        return;
                    }
                    setTimeout(tick, DELETE_SPEED);
                }
            }

            // Start after card entrance
            setTimeout(tick, 600);
        }

        // ==========================================
        // VISITOR COUNTER (API-based, fallback localStorage)
        // ==========================================
        function initVisitorCounter() {
            const display = document.getElementById('visitor-count');
            if (!display) return;

            // Try real counter API first
            var namespace = 'thienlong-ios-bio';
            var key = 'visits';
            var apiUrl = 'https://api.countapi.xyz/hit/' + namespace + '/' + key;

            fetch(apiUrl)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data && typeof data.value === 'number') {
                        animateCounter(display, data.value);
                    } else {
                        fallbackCounter(display);
                    }
                })
                .catch(function() {
                    fallbackCounter(display);
                });
        }

        function fallbackCounter(display) {
            // Fallback: localStorage
            var count = 0;
            try {
                count = parseInt(localStorage.getItem('tlios_visitors') || '0', 10);
                count++;
                localStorage.setItem('tlios_visitors', String(count));
            } catch (e) {
                count = 1;
            }
            animateCounter(display, count);
        }

        function animateCounter(el, target) {
            var current = 0;
            var step = Math.max(1, Math.floor(target / 40));
            var timer = setInterval(function() {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.textContent = current.toLocaleString();
            }, 30);
        }

        // ==========================================
        // SNOW EFFECT (optimized)
        // ==========================================
        function initSnow() {
            var canvas = document.getElementById('snow-canvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            if (!ctx) return;

            var width, height;
            var particles = [];
            var PARTICLE_COUNT = 60;
            var animFrame;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Create particles
            for (var i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 0.8,
                    speed: Math.random() * 0.8 + 0.3,
                    drift: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.4 + 0.3
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, ' + p.opacity + ')';
                    ctx.fill();

                    // Update
                    p.y += p.speed;
                    p.x += p.drift;

                    if (p.y > height + 5) {
                        p.y = -5;
                        p.x = Math.random() * width;
                    }
                    if (p.x > width + 5) p.x = -5;
                    if (p.x < -5) p.x = width + 5;
                }

                animFrame = requestAnimationFrame(draw);
            }

            // Pause when tab hidden
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    cancelAnimationFrame(animFrame);
                } else {
                    animFrame = requestAnimationFrame(draw);
                }
            });

            draw();
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.addEventListener('load', function() {
            initTilt();
            initAvatarStars();
            initTyping();
            initVisitorCounter();
            initSnow();

            // Show gyro banner if needed (iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('gyro-banner').style.display = 'block';
            }
        });

    })();
    </script>
