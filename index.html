<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thiên Long IOS - VN</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }
        
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Glassmorphism Card with smooth depth */
        .glass-card {
            background: rgba(15, 15, 15, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform-style: preserve-3d;
        }

        @keyframes neon-pulse {
            0% { box-shadow: 0 0 5px #0ea5e9, 0 0 10px #0ea5e9; }
            100% { box-shadow: 0 0 20px #0ea5e9, 0 0 35px #0ea5e9; }
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #0ea5e9;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slow-move {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .animate-bg {
            animation: slow-move 20s infinite ease-in-out;
        }

        #gyro-permission-btn {
            background: rgba(14, 165, 233, 0.2);
            border: 1px solid rgba(14, 165, 233, 0.5);
            transition: all 0.3s ease;
        }
        #gyro-permission-btn:hover {
            background: rgba(14, 165, 233, 0.4);
        }

        /* Interactive Glow Hover Effects for Social Buttons */
        .social-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .social-btn.facebook:hover {
            background: rgba(24, 119, 242, 0.15);
            border-color: rgba(24, 119, 242, 0.6);
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.4);
            transform: translateY(-2px);
        }
        .social-btn.zalo:hover {
            background: rgba(0, 104, 255, 0.15);
            border-color: rgba(0, 104, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 104, 255, 0.4);
            transform: translateY(-2px);
        }
        .social-btn.telegram:hover {
            background: rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.6);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            transform: translateY(-2px);
        }
        .social-btn.tiktok:hover {
            background: rgba(236, 72, 153, 0.15);
            border-color: rgba(236, 72, 153, 0.6);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="overflow-x-hidden bg-black text-white selection:bg-cyan-500 selection:text-white relative min-h-screen">
    
    <!-- Background Image with fallback error protection -->
    <img src="./1387268 (1).jpg" onerror="this.style.display='none'" alt="Background" class="animate-bg fixed inset-0 w-full h-full object-cover opacity-85 pointer-events-none" />
    
    <!-- Dark Gradient Overlay -->
    <div class="fixed inset-0 bg-gradient-to-b from-black/20 via-black/50 to-black pointer-events-none"></div>
    
    <!-- Canvas for Snow Effect -->
    <canvas id="snow-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <!-- Gyroscope Permission Prompt for iOS 13+ devices -->
    <div id="gyro-banner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden">
        <button id="gyro-permission-btn" onclick="requestGyroPermission()" class="text-xs px-3 py-1.5 rounded-full text-cyan-300 backdrop-blur-md shadow-lg flex items-center gap-1.5 cursor-pointer">
            <i class="fas fa-compass animate-spin"></i> Bật hiệu ứng nghiêng 3D
        </button>
    </div>

    <!-- Main Content Container with compact sizing -->
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4 py-6">
        
        <!-- 3D Tilt Box -->
        <div id="tilt-box" class="w-[85%] max-w-[290px] glass-card rounded-[2rem] p-5 flex flex-col items-center animate-[fadeInUp_0.8s_ease-out]">
            
            <!-- Avatar -->
            <div class="relative mb-3 group">
                <div class="absolute inset-0 bg-cyan-500 rounded-full blur-md opacity-40 group-hover:opacity-70 transition duration-500"></div>
                <img src="./6686ae04340f0125502a1fc08bf482da.jpg" onerror="this.onerror=null; this.src='https://placehold.co/200x200/0ea5e9/ffffff?text=Avatar'" alt="Avatar" class="relative w-20 h-20 rounded-full object-cover border-2 border-white/20 z-10 transition-transform duration-300 group-hover:scale-105" style="animation: neon-pulse 1.5s infinite alternate;">
            </div>

            <!-- Name and Glowing Sakura Icon -->
            <div class="flex items-center justify-center gap-1.5 mt-1 w-full whitespace-nowrap">
                <h1 class="text-[1.5rem] font-bold italic font-serif tracking-wide text-white drop-shadow-md">
                    Thiên Long IOS
                </h1>
                <div class="relative flex items-center justify-center hover:scale-110 transition-transform duration-300">
                    <span class="text-[20px] animate-pulse" style="filter: drop-shadow(0 0 10px rgba(255, 105, 180, 1));">🌸</span>
                </div>
            </div>

            <!-- Typing Effect -->
            <div class="typing-container mb-2 mt-1 w-full text-center">
                <span id="typing-text" class="text-gray-300 text-[10px] tracking-widest uppercase font-semibold"></span><span class="cursor">|</span>
            </div>

            <!-- Skill Tags -->
            <div class="flex flex-wrap justify-center gap-1 mb-4 w-full">
                <span class="px-2 py-0.5 text-[9px] font-semibold rounded-full border border-sky-500/50 text-sky-400 bg-sky-500/10 shadow-[0_0_6px_rgba(14,165,233,0.3)]"><i class="fas fa-laptop-code mr-1"></i> iOS Dev</span>
                <span class="px-2 py-0.5 text-[9px] font-semibold rounded-full border border-[#39ff14]/50 text-[#39ff14] bg-[#39ff14]/10 shadow-[0_0_6px_rgba(57,255,20,0.3)]"><i class="fas fa-dragon mr-1"></i> Hắc Long</span>
                <span class="px-2 py-0.5 text-[9px] font-semibold rounded-full border border-purple-500/50 text-purple-400 bg-purple-500/10 shadow-[0_0_6px_rgba(168,85,247,0.3)]"><i class="fas fa-gamepad mr-1"></i> Gamer</span>
            </div>

            <!-- Social Links with Interactive Glow Hover -->
            <div class="w-full flex flex-col gap-2.5">
                <a href="https://www.facebook.com/share/1J5D6FRsGB/?mibextid=wwXIfr" target="_blank" class="social-btn facebook relative group flex items-center justify-center w-full py-2 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 overflow-hidden shadow-sm">
                    <i class="fab fa-facebook text-blue-500 text-base absolute left-4 group-hover:scale-125 transition-transform"></i>
                    <span class="font-medium tracking-wide text-xs">Facebook</span>
                </a>
                
                <a href="http://zaloapp.com/qr/p/1409r842vh1p1" target="_blank" class="social-btn zalo relative group flex items-center justify-center w-full py-2 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 overflow-hidden shadow-sm">
                    <i class="fas fa-comment-dots text-sky-400 text-base absolute left-4 group-hover:scale-125 transition-transform"></i>
                    <span class="font-medium tracking-wide text-xs">Zalo</span>
                </a>
                
                <a href="https://t.me/tlios_alex" target="_blank" class="social-btn telegram relative group flex items-center justify-center w-full py-2 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 overflow-hidden shadow-sm">
                    <i class="fab fa-telegram plane text-cyan-500 text-base absolute left-4 group-hover:scale-125 transition-transform"></i>
                    <span class="font-medium tracking-wide text-xs">Telegram</span>
                </a>

                <a href="https://www.tiktok.com/@bon_3004._?_r=1&_t=ZS-9A8fnAcy6jK" target="_blank" class="social-btn tiktok relative group flex items-center justify-center w-full py-2 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 overflow-hidden shadow-sm">
                    <i class="fab fa-tiktok text-white group-hover:text-pink-500 text-base absolute left-4 group-hover:scale-125 transition-transform"></i>
                    <span class="font-medium tracking-wide text-xs">TikTok</span>
                </a>
            </div>
            
            <!-- Visitor Counter & Footer -->
            <div class="mt-4 flex flex-col items-center gap-1">
                <div class="text-[10px] text-gray-400 tracking-wider flex items-center gap-1 bg-white/5 px-2.5 py-0.5 rounded-full border border-white/10">
                    <i class="fas fa-eye text-cyan-400"></i> Truy cập: <span id="visitor-count" class="font-bold text-cyan-300">4,560</span>
                </div>
                <div class="text-[9px] text-gray-500 tracking-wider">
                    ©thienlongios
                </div>
            </div>
        </div>
    </div>

    <!-- VanillaTilt 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    
    <script>
        // Enhanced 3D Tilt Initialization
        VanillaTilt.init(document.querySelector("#tilt-box"), {
            max: 15,          
            speed: 400,       
            glare: true,      
            "max-glare": 0.3, 
            scale: 10,      
            gyroscope: true   
        });

        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            document.getElementById('gyro-banner').style.display = 'none';
                        }
                    })
                    .catch(console.error);
            } else {
                document.getElementById('gyro-banner').style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('gyro-banner').style.display = 'block';
            }
        });

        // Typing effect
        const text = "ĐẸP TRAI VÀ ĐẲNG CẤP";
        let textIndex = 0;
        function typeWriter() {
            const typingElement = document.getElementById("typing-text");
            if (typingElement && textIndex < text.length) {
                typingElement.innerHTML += text.charAt(textIndex);
                textIndex++;
                setTimeout(typeWriter, 120);
            }
        }

        // Visitor counter
        function initVisitorCounter() {
            let countObj = localStorage.getItem('tlios_visitors');
            let count = 4560; 
            if (countObj) {
                count = parseInt(countObj) + 1;
            }
            localStorage.setItem('tlios_visitors', count);
            
            const countDisplay = document.getElementById('visitor-count');
            if (countDisplay) {
                countDisplay.innerText = count.toLocaleString();
            }

            setInterval(() => {
                if (Math.random() > 0.6) {
                    count++;
                    localStorage.setItem('tlios_visitors', count);
                    if (countDisplay) {
                        countDisplay.innerText = count.toLocaleString();
                    }
                }
            }, 6000);
        }

        window.onload = () => {
            typeWriter();
            initVisitorCounter();
        };

        // Snowfall effect
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2 + 1,    
                speed: Math.random() * 1 + 0.5 
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        function updateSnow() {
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.y += p.speed; 
                
                if (p.y > height) {
                    p.y = -10; 
                    if (width > 0) {
                        p.x = Math.max(5, Math.min(width - 5, Math.random() * width));
                    }
                }
            }
        }
        drawSnow();
    </script>
</body>
</html>
